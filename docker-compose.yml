services:
  cosense-mcp:
    build: .
    ports:
      - "4100:4100"
    environment:
      - TRANSPORT=http
      - PORT=4100
      - COSENSE_PROJECT_NAME=${COSENSE_PROJECT_NAME}
      # 触れるプロジェクトの上限。未設定なら無制限（＝SIDが届く全プロジェクト）
      - COSENSE_PROJECT_ALLOW_LIST=${COSENSE_PROJECT_ALLOW_LIST:-}
      - COSENSE_SID=${COSENSE_SID}
      # ローカル用のフォールバック。既定は未設定（OAuth が主認証）
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-}
      - MCP_OAUTH_PASSPHRASE=${MCP_OAUTH_PASSPHRASE:-}
      # 再起動のたびに再認可させないため、コンテナ外に置く
      - MCP_OAUTH_STORE=/data/oauth-store.json
      - MCP_TRUST_PROXY=${MCP_TRUST_PROXY:-1}
      - MCP_ALLOW_UNAUTHENTICATED=${MCP_ALLOW_UNAUTHENTICATED:-false}
      # 設定するとOrigin検証がenforceになる（未設定はreport＝ログのみ）
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      # 破壊的ツール（delete_page / rewrite_page）。未設定なら tools/list にも出ない
      - COSENSE_ENABLE_DELETE=${COSENSE_ENABLE_DELETE:-}
      - COSENSE_NOTATION_CONFIG=/app/notation.config.json
      - COSENSE_NOTATION_PAGE=${COSENSE_NOTATION_PAGE:-}
    volumes:
      - ./notation.config.json:/app/notation.config.json:ro
      - oauth-data:/data
    restart: unless-stopped

volumes:
  oauth-data:
